{% extends "base.html" %}

{% block title %}Admin Login — Wedding Face Finder{% endblock %}

{% block content %}

<section class="section" style="padding-top: 140px; min-height: 80vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 420px;">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 style="margin-bottom: 8px;">Admin Access</h1>
      <p style="color: var(--text-secondary);">Sign in to manage events and view audit logs.</p>
    </div>

    <div class="admin-card" style="padding: 40px;">
      <form method="POST" action="{{ url_for('views.admin_login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" required autocomplete="username" placeholder="admin">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
    </div>

    <p style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted);">
      Protected by rate limiting. Suspicious activity is logged.
    </p>
  </div>
</section>

{% endblock %}
