{% extends "base.html" %}

{% block title %}Your Photos — Wedding Face Finder{% endblock %}

{% block content %}

<section class="section" style="padding-top: 120px; padding-bottom: 120px;">
  <div class="container">
    <p class="label" style="margin-bottom: 12px;">Search Results</p>
    <div class="results-header">
      <div>
        <h1 style="margin-bottom: 4px;">Found You</h1>
        <p class="results-count">Showing <strong id="matchCount">0</strong> matches from this event</p>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-secondary btn-sm" id="selectAllBtn">Select All</button>
        <button class="btn btn-secondary btn-sm" id="clearSelectionBtn">Clear</button>
      </div>
    </div>

    <div class="masonry" id="resultsGrid"></div>

    <div id="emptyState" style="display: none; text-align: center; padding: 80px 0;">
      <div style="color: var(--text-muted); margin-bottom: 16px;">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto;">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <h3 style="margin-bottom: 8px;">No matches found</h3>
      <p style="color: var(--text-secondary);">Try a clearer selfie with better lighting.</p>
    </div>
  </div>
</section>

<div class="download-bar" id="downloadBar">
  <div style="display: flex; align-items: center; gap: 12px;">
    <span class="text-mono" id="selectedCount">0 selected</span>
  </div>
  <div style="display: flex; gap: 12px;">
    <button class="btn btn-secondary btn-sm" id="cancelDownloadBtn">Cancel</button>
    <button class="btn btn-primary btn-sm" id="downloadZipBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
      Download ZIP
    </button>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/results.js') }}"></script>
{% endblock %}
